name: .NET

on:
  push:
    branches: [main, deploy]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.100-preview.7.26381.103

      - name: Restore
        run: dotnet restore src/Tedd.Voxtree.sln

      - name: Build
        run: dotnet build src/Tedd.Voxtree.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Tedd.Voxtree.sln --no-build --configuration Release --verbosity normal

      - name: Verify package
        run: dotnet pack src/Tedd.Voxtree/Tedd.Voxtree.csproj --no-build --configuration Release --output artifacts/packages

  publish:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.100-preview.7.26381.103

      - name: Set automatic package version
        id: version
        shell: pwsh
        run: |
          $projectPath = 'src/Tedd.Voxtree/Tedd.Voxtree.csproj'
          $project = [xml](Get-Content -LiteralPath $projectPath)
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $versionNode) {
            throw "No Version element found in $projectPath."
          }
          $baseVersion = [version]$versionNode.InnerText
          # A workflow rerun retains its version; every new run advances the patch.
          $packageVersion = '{0}.{1}.{2}' -f $baseVersion.Major, $baseVersion.Minor, ($baseVersion.Build + [int]$env:GITHUB_RUN_NUMBER)
          $versionNode.InnerText = $packageVersion
          $project.Save((Resolve-Path -LiteralPath $projectPath))
          "version=$packageVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing Tedd.Voxtree $packageVersion"

      # publish-nuget-neo has no v2 tag yet. Pin the current v2 implementation
      # instead of using the obsolete v1 tag.
      - name: Publish on version change
        id: publish_nuget
        uses: tedd/publish-nuget-neo@1a65ed85a859c9f4905b61c58afe6b1dcbb74ae4
        with:
          NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
          PROJECT_FILE_PATH: src/Tedd.Voxtree/Tedd.Voxtree.csproj
          PACKAGE_NAME: Tedd.Voxtree
          NUGET_SOURCE: https://api.nuget.org
          INCLUDE_SYMBOLS: true
          TAG_COMMIT: true
          TAG_FORMAT: v*
          REBUILD_PROJECT: false
          LOG_LEVEL: INFO
